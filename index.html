<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard Platform Team — the platform behind the Red Hat OpenShift AI dashboard: modular architecture, Dashboard Operator, Core BFF, distributions and onboarding.">
  <meta name="theme-color" content="#0066cc">
  <title>Dashboard Platform Team · Red Hat OpenShift AI</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- PatternFly 6: the same design system as the RHOAI dashboard. Pinned; bump together with tools/build-icons.mjs. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@patternfly/patternfly@6.6.1/patternfly.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@patternfly/patternfly@6.6.1/patternfly-addons.css">
  <link rel="stylesheet" href="css/site.css">
  <script>
    // Theme before first paint (light · dark · felt), remembered per browser.
    try {
      const t = localStorage.getItem('mo-theme');
      const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('pf-v6-theme-dark', dark);
      document.documentElement.classList.toggle('pf-v6-theme-felt', t === 'felt');
    } catch (e) {}
  </script>
</head>
<body>
  <a class="pf-v6-c-skip-to-content pf-v6-c-button pf-m-primary" href="#main">Skip to content</a>
  <div class="pf-v6-c-page" id="page">
    <header class="pf-v6-c-masthead" id="masthead"></header>
    <div class="pf-v6-c-page__sidebar" id="sidebar"></div>
    <div class="pf-v6-c-page__main-container" tabindex="-1">
      <main class="pf-v6-c-page__main" id="main" tabindex="-1"></main>
    </div>
  </div>
  <noscript>This page renders its content with JavaScript. Please enable it.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
